server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compresión gzip para JS/CSS grandes
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Archivos estáticos con caché larga
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ENLACE AL VOLUMEN EN VIVO (/app/data)
    # Cuando React busque algo en '/data/', Nginx lo leerá directamente de la ruta raíz del contenedor
    location /data/ {
        alias /app/data/;
        
        # Forzar a que el navegador nunca guarde en caché estos JSON
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Expires "0";
    }

    # Redirigir todas las rutas al index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}